aid: avrea
name: Avrea
description: >-
  Avrea is CI/CD infrastructure for GitHub Actions: high-performance managed
  runners (AMD EPYC and Apple M-series), smart multi-system caching, and full
  build observability with flaky-test detection and live SSH debugging into
  running jobs. A one-line change to a GitHub Actions workflow migrates jobs
  onto Avrea's runners across Linux, macOS, and Windows, with isolated per-job
  VMs, encrypted caching, and SOC 2 Type II, ISO 27001, and GDPR compliance.
  The platform is operated through the web console at console.avrea.com and the
  avr command-line client, and is backed by earlybird.
